[jinja2format-command]
syntax = jinja2format (<jinjaformat-options>)* <field-name>
shortdesc = Take the output records and the given Jinja2 template and make it a nice result
usage = public
example1 = jinja2format "Hello, {{ name }}"
comment1 = Takes the 'name' field and renders a nice and welcoming hello.
example2 = jinja2format result=out "Hello, {{ name }}"
comment2 = Takes the 'name' field and renders a nice and welcoming hello. The result will be in 'out' field.
example3 = jinja2format on_error=null "Hello, {{ missing }}"
comment3 = Renders events using jinja2, returning null on template errors instead of error messages.

[jinjaformat-options]
syntax = result=<field-name> | on_error=<message|fail|null>
description = Options for jinja2format: \
   result=<field-name>: Field name for the output (default: 'formatted_template'). \
   on_error=<message|fail|null>: Error handling behavior on template syntax or rendering errors (default: 'message').
