[jinja2format-command]
syntax = jinja2format (<jinjaformat-options>)* (<field-name>)?
shortdesc = Render records using Jinja2 templates (inline or from Splunk KV Store)
usage = public
example1 = jinja2format @child.html
comment1 = Renders child.html loaded from the KV store using the @ prefix convention.
example2 = jinja2format ref="threat-intel:alert.html"
comment2 = Renders alert.html from the threat-intel app KV store using the ref option.
example3 = jinja2format "Hello, {{ name }}!"
comment3 = Renders an inline template with event fields.
example4 = jinja2format result=out ref=template_field
comment4 = Resolves KV store template reference dynamically from an event field into 'out'.

[jinjaformat-options]
syntax = ref=<string> | result=<field-name> | on_error=<message|fail|null>
description = Options for jinja2format: \
   ref=<string>: KV Store template reference (e.g. 'child.html', 'app:alert.html') or event field name. \
   result=<field-name>: Field name for the output (default: 'formatted_template'). \
   on_error=<message|fail|null>: Error handling behavior on template syntax or rendering errors (default: 'message').
